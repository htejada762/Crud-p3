<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Express - Git Flow</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, button { padding: 8px; margin: 5px 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h2>Gestor de Tareas (CRUD)</h2>
  <div id="app">
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Escribe una tarea...">
      <button type="submit">Agregar</button>
    </form>
    <ul id="task-list"></ul>
  </div>

  <script>
    const tasks = [];
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');

    function renderTasks() {
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        list.innerHTML += `
          <li>
            ${task}
            <button onclick="deleteTask(${index})">Eliminar</button>
          </li>`;
      });
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      
      // Validación para evitar tareas vacías
      if (!val) {
        alert('¡El texto no puede estar vacío!');
        return;
      }

      tasks.push(val);
      input.value = '';
      renderTasks();
    });
  </script>
</body>
</html>
